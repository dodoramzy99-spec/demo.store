<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر التجربة - Demo Store</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .product-img { width: 100%; height: 200px; background-color: #e5e7eb; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #6b7280; margin-bottom: 15px; }
        .price { font-size: 22px; color: #059669; font-weight: bold; margin: 10px 0; }
        .btn { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-add { background-color: #2563eb; color: white; }
        .btn-add:hover { background-color: #1d4ed8; }
        .btn-checkout { background-color: #059669; color: white; display: none; }
        .btn-checkout:hover { background-color: #047857; }
        .checkout-form { display: none; margin-top: 20px; text-align: right; border-top: 1px solid #e5e7eb; padding-top: 15px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; }
        .form-group input { width: 95%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; }
        .thank-you { display: none; background: #ecfdf5; color: #065f46; padding: 20px; border-radius: 8px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>ساعة ذكية - Smart Watch</h2>
        <div class="product-img">صورة المنتج</div>
        <div class="price">500 ج.م</div>

        <!-- أزرار الأحداث -->
        <button id="btn-add-to-cart" class="btn btn-add">إضافة إلى السلة (Add to Cart)</button>
        <button id="btn-checkout" class="btn btn-checkout">إتمام الشراء (Checkout)</button>

        <!-- نموذج إتمام الطلب -->
        <div id="checkout-form" class="checkout-form">
            <h3>بيانات الشحن</h3>
            <div class="form-group">
                <label>الاسم الكامل:</label>
                <input type="text" id="cust-name" placeholder="أدخل اسمك">
            </div>
            <div class="form-group">
                <label>رقم الهاتف:</label>
                <input type="tel" id="cust-phone" placeholder="أدخل رقم هاتفك">
            </div>
            <button id="btn-submit-order" class="btn btn-add" style="background-color: #10b981;">تأكيد الطلب (Purchase)</button>
        </div>

        <!-- رسالة الشكر (Thank You) -->
        <div id="thank-you-msg" class="thank-you">
            🎉 تم استلام طلبك بنجاح! شكرًا لتسوقك معنا.
        </div>
    </div>

    <script>
        // تفاعلات بسيطة عشان التجربة تكون حية
        const addToCartBtn = document.getElementById('btn-add-to-cart');
        const checkoutBtn = document.getElementById('btn-checkout');
        const checkoutForm = document.getElementById('checkout-form');
        const submitOrderBtn = document.getElementById('btn-submit-order');
        const thankYouMsg = document.getElementById('thank-you-msg');

        addToCartBtn.addEventListener('click', function() {
            alert('تمت إضافة المنتج للسلة!');
            checkoutBtn.style.display = 'block';
        });

        checkoutBtn.addEventListener('click', function() {
            checkoutForm.style.display = 'block';
        });

        submitOrderBtn.addEventListener('click', function() {
            checkoutForm.style.display = 'none';
            addToCartBtn.style.display = 'none';
            checkoutBtn.style.display = 'none';
            thankYouMsg.style.display = 'block';
        });
    </script>

</body>
</html>
