    <title>متجر التدريب - الصفحة الرئيسية</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f8fafc; margin: 0; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .products-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1000px; margin: auto; }
        .product-card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; width: 280px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .product-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        .product-card h3 { font-size: 18px; margin: 10px 0 5px; color: #1e293b; }
        .price { font-size: 20px; color: #16a34a; font-weight: bold; margin-bottom: 15px; }
        .btn { display: block; width: 100%; padding: 10px 0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; box-sizing: border-box; }
        .btn-add { background-color: #2563eb; color: white; margin-bottom: 8px; }
        .btn-checkout { background-color: #16a34a; color: white; }
    </style>

    <div class="header">
        <h1>🛍️ متجر التكنولوجيا العصرية</h1>
        <p>اختر من أحدث المنتجات واختبر تجربة الشراء والتتبع الحقيقية</p>
    </div>

    <div class="products-grid">
        <!-- المنتج الأول -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="ساعة ذكية">
            <h3>ساعة ذكية - Smart Watch</h3>
            <div class="price">750 ج.م</div>
            <button class="btn btn-add" onclick="alert('تمت إضافة الساعة للسلة!')">إضافة إلى السلة (AddToCart)</button>
            <a href="checkout.html?product=SmartWatch&price=750" class="btn btn-checkout">شراء الآن (Checkout)</a>
        </div>

        <!-- المنتج الثاني -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" alt="سماعة لاسلكية">
            <h3>سماعة بلوتوث - Wireless Headphones</h3>
            <div class="price">1,200 ج.م</div>
            <button class="btn btn-add" onclick="alert('تمت إضافة السماعة للسلة!')">إضافة إلى السلة (AddToCart)</button>
            <a href="checkout.html?product=Headphones&price=1200" class="btn btn-checkout">شراء الآن (Checkout)</a>
        </div>

        <!-- المنتج الثالث -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=500" alt="حذاء رياضي">
            <h3>حذاء رياضي - Running Shoes</h3>
            <div class="price">950 ج.م</div>
            <button class="btn btn-add" onclick="alert('تمت إضافة الحذاء للسلة!')">إضافة إلى السلة (AddToCart)</button>
            <a href="checkout.html?product=Shoes&price=950" class="btn btn-checkout">شراء الآن (Checkout)</a>
        </div>
    </div>
