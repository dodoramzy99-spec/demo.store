<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر التدريب - Demo Store</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #f4f6f8; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: inline-block; max-width: 400px; }
        h1 { color: #333; }
        p { color: #666; font-size: 16px; }
        button { background-color: #2563eb; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

    <div class="card">
        <h1>أهلاً بك في متجر التدريب! 🎉</h1>
        <p>صفحة تجريبية لربط أدوات التتبع والميديا باينج (GTM, Meta Pixel, GA4).</p>
        <button id="btn-buy">اضغط لشراء المنتج الآن</button>
    </div>

</body>
</html>
