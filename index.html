<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر التدريب - الصفحة الرئيسية</title>
    <!-- Google Tag Manager Code بيتحط هنا من خلالك لو حابب -->
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 12px; max-width: 40px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin: 8px; font-weight: bold; }
        .btn-add { background-color: #28a745; color: white; }
        .btn-checkout { background-color: #007bff; color: white; }
        input { padding: 10px; width: 80%; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>منتج تجريبي للعرض</h2>
        <p>السعر: 500 جنيه</p>
        
        <!-- زر إضافة إلى السلة -->
        <button id="add-to-cart-btn" class="btn btn-add">إضافة إلى السلة</button>
        
        <hr style="margin: 20px 0; border: 0.5px solid #eee;">

        <!-- نموذج الشراء وبدء الطلب -->
        <h3>بيانات الشراء</h3>
        <form action="thank-you.html" method="GET">
            <input type="text" name="name" placeholder="الاسم بالكامل" required><br>
            <input type="tel" name="phone" placeholder="رقم الهاتف" required><br>
            <input type="text" name="address" placeholder="العنوان" required><br>
            
            <!-- زر إتمام الشراء / InitiateCheckout -->
            <button type="submit" id="checkout-btn" class="btn btn-checkout">إتمام الطلب الآن</button>
        </form>
    </div>

</body>
</html>
