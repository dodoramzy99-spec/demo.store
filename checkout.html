<!<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>صفحة الدفع - Checkout</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f8f9fa; }
        .card { background: white; padding: 30px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; }
        .btn { padding: 12px 20px; background: #17a2b8; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 95%; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>إتمام الشراء (Checkout)</h2>
        <form action="thank-you.html" method="GET">
            <input type="text" placeholder="الاسم بالكامل" required><br>
            <input type="tel" placeholder="رقم الهاتف" required><br>
            <button type="submit" id="purchase-btn" class="btn">تأكيد الشراء (Purchase)</button>
        </form>
    </div>
</body>
</html>
